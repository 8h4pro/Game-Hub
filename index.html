<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game Hub</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header>

        <h1>GAME HUB</h1>

        <p>Your ultimate gaming hub</p>

        <button onclick="showAccount()">
            ACCOUNT
        </button>

        <div id="coinDisplay">
            🪙 <span id="coinBalance">0</span>
        </div>

    </header>


    <main>

        <h2>GAMES</h2>

        <div class="games">

            <div class="game-card">

                <div class="game-icon">
                    🏎️
                </div>

                <h3>Track Racer</h3>

                <p>
                    Race around the tracks and beat your best times.
                </p>

                <button
                    onclick="window.location.href='games/track-racer/index.html'"
                >
                    PLAY
                </button>

            </div>


            <div class="game-card">

                <div class="game-icon">
                    🎮
                </div>

                <h3>Coming Soon</h3>

                <p>
                    More games are coming to Game Hub.
                </p>

                <button disabled>
                    SOON
                </button>

            </div>

        </div>

    </main>


    <div id="accountWindow">

        <div class="account-box">

            <h2>YOUR ACCOUNT</h2>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                maxlength="20"
            >

            <p id="accountMessage">
                Enter a username to create your account.
            </p>

            <button onclick="login()">
                SAVE ACCOUNT
            </button>

            <button onclick="logout()">
                LOG OUT
            </button>

            <button onclick="closeAccount()">
                CLOSE
            </button>

        </div>

    </div>


    <footer>

        <p>
            Game Hub © 2026
        </p>

    </footer>


    <script src="account.js"></script>
    <script src="coins.js"></script>

</body>

</html>
